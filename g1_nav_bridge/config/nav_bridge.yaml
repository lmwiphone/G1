g1_cmdvel_to_sport:
  ros__parameters:
    cmd_vel_topic: /cmd_vel_safe
    emergency_stop_topic: /g1/emergency_stop
    status_topic: /g1_cmdvel_to_sport/status
    # 使用 unitree_ros2 官方 LocoClient，经 /api/sport/request 和 response 控制。
    allowed_fsm_ids: [500, 501, 801, 802]
    rate_hz: 30.0
    timeout_s: 0.20
    max_vx: 1.0
    max_vy: 0.0
    max_wz: 0.25
    max_ax: 1.0
    max_ay: 0.35
    max_awz: 0.60
    enabled_on_start: false

g1_sport_to_odom:
  ros__parameters:
    input_topic: /odommodestate
    output_topic: /odom
    odom_frame: odom
    base_frame: base_link
    stale_timeout: 0.5
    # Provisional variances, not Unitree-reported/calibrated uncertainty.
    pose_covariance_diagonal: [0.1, 0.1, 1000000.0, 1000000.0, 1000000.0, 0.1]
    twist_covariance_diagonal: [0.1, 0.1, 1000000.0, 1000000.0, 1000000.0, 0.1]
