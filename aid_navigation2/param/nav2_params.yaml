collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_remote_ctrl"
    cmd_vel_out_topic: "cmd_vel_remote_ctrl_safe"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone geometry
    polygons: ["FootprintApproach", "SafetyZone"]
    FootprintApproach:
      type: "polygon"
      footprint_topic: "/local_costmap/published_footprint"
      action_type: "approach"
      min_points: 4
      visualize: True
      enabled: True
      # Slow down when within this zone
      approach_time_before_collision: 2.0  # time to collision (seconds)
    SafetyZone:
      type: "circle"
      action_type: "approach"
      radius: 0.25
      visualize: True
      enabled: True
      # Allow backing away: only intervene when time-to-collision is small
      approach_time_before_collision: 0.5
    observation_sources: ["scan", "pointcloud"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.05
      max_height: 2.0
      enabled: True
    pointcloud:
      type: "pointcloud"
      topic: "/aurora_2/points2_filted"
      min_height: 0.05
      max_height: 1.5
      enabled: True
      obstacles_angle: 1.5708  # 90 degrees, range of angles to check
